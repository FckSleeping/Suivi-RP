name: Synchronisation du forum

# Lance toutes les 30 minutes, et a la demande (onglet Actions > Run workflow).
# GitHub peut retarder un peu les lancements programmes : ce n'est pas une horloge precise.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synchro
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Synchroniser
        env:
          FORUM_USER: ${{ secrets.FORUM_USER }}
          FORUM_PASSWORD: ${{ secrets.FORUM_PASSWORD }}
        run: python scripts/sync.py
      - name: Enregistrer les donnees
        run: |
          git config user.name "synchro-rp"
          git config user.email "synchro-rp@users.noreply.github.com"
          git add data/forum.json data/status.json
          git diff --cached --quiet && exit 0
          git commit -m "Synchronisation du forum"
          git pull --rebase
          git push
