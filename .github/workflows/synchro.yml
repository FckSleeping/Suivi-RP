name: Synchronisation du forum

# Lancement a la demande uniquement (l'automatisation viendra a l'etape 3).
on:
  workflow_dispatch:
    inputs:
      decouverte:
        description: "Chercher les nouveaux sujets (oui / non / auto)"
        default: "oui"

permissions:
  contents: write

concurrency:
  group: synchro
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Synchroniser
        env:
          FORUM_USER: ${{ secrets.FORUM_USER }}
          FORUM_PASSWORD: ${{ secrets.FORUM_PASSWORD }}
        run: python scripts/sync.py --discover "${{ github.event.inputs.decouverte }}"
      - name: Enregistrer les donnees
        run: |
          git config user.name "synchro-rp"
          git config user.email "synchro-rp@users.noreply.github.com"
          git add data/forum.json data/status.json
          git diff --cached --quiet || git commit -m "Synchronisation du forum"
          git push
